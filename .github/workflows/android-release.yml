name: Android Release

# با هر تگ نسخه (مثلاً v2.1.0):
#   ۱. APK و AAB امضاشده برای کافه‌بازار و مایکت ساخته می‌شود
#   ۲. یک GitHub Release با همین فایل‌ها و توضیحات نسخه ساخته می‌شود
# پیام تلگرام جداست: workflow «Release Notes».
#
# Secrets لازم (Settings ← Secrets and variables ← Actions):
#   ANDROID_KEYSTORE_BASE64   فایل release.jks به base64
#   ANDROID_KEYSTORE_PASSWORD رمز keystore
#   ANDROID_KEY_ALIAS         نام کلید (مثلاً qeymat)
#   ANDROID_KEY_PASSWORD      رمز کلید
# تا وقتی این‌ها تنظیم نشده‌اند، ساخت با یک هشدار رد می‌شود و خطا نمی‌دهد.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "تگ نسخه‌ای که دوباره ساخته شود (مثلاً v2.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: بررسی کلید امضا
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secretهای امضای اندروید تنظیم نشده‌اند؛ APK انتشار ساخته نشد."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          ref: ${{ inputs.tag || github.ref }}
          # تاریخچه‌ی کامل برای توضیحات نسخه از تگ قبلی
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          gradle-version: "8.11.1"

      - name: آماده‌سازی کلید امضا
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: تست و ساخت APK و AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        run: |
          VERSION="${TAG#v}"
          gradle --no-daemon --stacktrace -PappVersion="$VERSION" :core:model:test assembleRelease bundleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk "../../dist/qeymat-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "../../dist/qeymat-$VERSION.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: پاک کردن کلید از دیسک
        if: always() && steps.signing.outputs.ready == 'true'
        working-directory: apps/android
        run: rm -f release.jks keystore.properties

      - name: GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout تگ annotated را سبک می‌کند؛ پیام تگ دوباره گرفته می‌شود
          git fetch --force --tags origin > /dev/null 2>&1
          bash .github/scripts/release-notes.sh "$TAG" > dist/NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.aab --title "قیمت $VERSION" --notes-file dist/NOTES.md
          fi
