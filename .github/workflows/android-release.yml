name: Android Release

# با هر تگ نسخه (مثلاً v2.1.0):
#   ۱. APK و AAB امضاشده برای کافه‌بازار و مایکت ساخته می‌شود
#   ۲. یک GitHub Release با همین فایل‌ها و فهرست تغییرات ساخته می‌شود
#   ۳. خبر نسخه و فایل APK در تاپیک تلگرام گروه فرستاده می‌شود
#
# Secrets لازم (Settings ← Secrets and variables ← Actions):
#   ANDROID_KEYSTORE_BASE64   فایل release.jks به base64
#   ANDROID_KEYSTORE_PASSWORD رمز keystore
#   ANDROID_KEY_ALIAS         نام کلید (مثلاً qeymat)
#   ANDROID_KEY_PASSWORD      رمز کلید
#   TELEGRAM_BOT_TOKEN        توکن ربات از BotFather   (اختیاری؛ نبودش یعنی پیامی فرستاده نمی‌شود)
#   TELEGRAM_CHAT_ID          شناسه‌ی گروه، مثل -1001234567890
#   TELEGRAM_TOPIC_ID         شناسه‌ی تاپیک (message_thread_id)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "تگ نسخه‌ای که دوباره ساخته شود (مثلاً v2.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # تاریخچه‌ی کامل برای فهرست تغییرات از تگ قبلی
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: آماده‌سازی کلید امضا
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secretهای امضای اندروید تنظیم نشده‌اند؛ بازار و مایکت APK بدون امضا را نمی‌پذیرند."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: تست و ساخت APK و AAB
        working-directory: apps/android
        run: |
          VERSION="${TAG#v}"
          gradle --no-daemon --stacktrace -PappVersion="$VERSION" :core:model:test assembleRelease bundleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/*.apk "../../dist/qeymat-$VERSION.apk"
          cp app/build/outputs/bundle/release/*.aab "../../dist/qeymat-$VERSION.aab"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: پاک کردن کلید از دیسک
        if: always()
        working-directory: apps/android
        run: rm -f release.jks keystore.properties

      - name: فهرست تغییرات
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          RANGE="${PREVIOUS:+$PREVIOUS..}$TAG"
          # فقط خط اول هر کامیت؛ کامیت‌های ادغام حذف می‌شوند
          git log --no-merges --pretty='- %s' "$RANGE" > dist/CHANGES.md
          [ -s dist/CHANGES.md ] || echo "- بهبودهای جزئی" > dist/CHANGES.md
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          cat dist/CHANGES.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/*.aab --clobber
          else
            gh release create "$TAG" dist/*.apk dist/*.aab --title "قیمت $VERSION" --notes-file dist/CHANGES.md
          fi

      - name: خبر در تاپیک تلگرام
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "ربات تلگرام تنظیم نشده؛ پیامی فرستاده نشد."
            exit 0
          fi
          API="https://api.telegram.org/bot$BOT_TOKEN"
          THREAD=()
          [ -n "$TOPIC_ID" ] && THREAD=(--form-string "message_thread_id=$TOPIC_ID")

          # متن تغییرات برای HTML تلگرام امن می‌شود و زیر سقف ۴۰۹۶ نویسه می‌ماند؛
          # بریدن بر اساس خط است تا حرف فارسی نصفه نشود
          CHANGES=$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' dist/CHANGES.md | head -n 40)
          [ "$(wc -l < dist/CHANGES.md)" -gt 40 ] && CHANGES="$CHANGES"$'\n- …'
          TEXT=$(printf '🚀 <b>نسخه‌ی %s قیمت منتشر شد</b>\n\n<b>تغییرات%s:</b>\n%s\n\n<a href="%s">صفحه‌ی نسخه در گیت‌هاب</a>' \
            "$VERSION" "${PREVIOUS:+ از $PREVIOUS}" "$CHANGES" "$RELEASE_URL")

          # --form-string: متن کامیت‌ها نباید به‌عنوان گزینه‌ی curl (@فایل، ;type=) خوانده شود
          curl -sS --fail-with-body "$API/sendMessage" "${THREAD[@]}" \
            --form-string "chat_id=$CHAT_ID" --form-string "parse_mode=HTML" \
            --form-string "disable_web_page_preview=true" --form-string "text=$TEXT"

          # فایل APK برای نصب مستقیم (سقف ارسال ربات ۵۰ مگابایت است)
          curl -sS --fail-with-body "$API/sendDocument" "${THREAD[@]}" \
            --form-string "chat_id=$CHAT_ID" \
            -F "document=@dist/qeymat-$VERSION.apk" \
            --form-string "caption=APK نسخه‌ی $VERSION — امضاشده، همان فایلی که در بازار و مایکت بارگذاری می‌شود"
          echo
          echo "پیام نسخه در تلگرام فرستاده شد."
