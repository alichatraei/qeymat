# ---------------------------------------------------------------
# قیمت — بلوک nginx برای qeymat.online
#
# روی سرور در /etc/nginx/sites-available/qeymat.online بگذارید و لینک کنید:
#   ln -s /etc/nginx/sites-available/qeymat.online /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# چون این پروژه کنار بقیه پروژه‌ها روی همین nginx می‌نشیند، هیچ تنظیم
# سراسری اینجا تعریف نشده تا با سایت‌های دیگر تداخل نکند.
# ---------------------------------------------------------------

upstream qeymat_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# نرخ‌محدودکننده اختصاصی همین سایت
limit_req_zone $binary_remote_addr zone=qeymat_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name qeymat.online www.qeymat.online;

    # Cloudflare خودش TLS را می‌بندد؛ این ریدایرکت برای دسترسی مستقیم است
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://qeymat.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.qeymat.online;

    ssl_certificate     /etc/letsencrypt/live/qeymat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qeymat.online/privkey.pem;

    return 301 https://qeymat.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qeymat.online;

    ssl_certificate     /etc/letsencrypt/live/qeymat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qeymat.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:qeymat_ssl:10m;
    ssl_session_timeout 1d;

    # IP واقعی کاربر از پشت Cloudflare
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml font/woff2;

    access_log /var/log/nginx/qeymat.access.log;
    error_log  /var/log/nginx/qeymat.error.log;

    # سرویس‌ورکر هرگز کش نمی‌شود، وگرنه نسخه‌ی قدیمی اپ گیر می‌کند
    location = /sw.js {
        proxy_pass http://qeymat_web;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # دارایی‌های هش‌دار Next — کش طولانی
    location /_next/static/ {
        proxy_pass http://qeymat_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /fonts/ {
        proxy_pass http://qeymat_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API عمومی مشتریان — محدودیت نرخ لبه‌ای
    location /api/v1/ {
        limit_req zone=qeymat_api burst=60 nodelay;
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://qeymat_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
