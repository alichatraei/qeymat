# ---------------------------------------------------------------
# قیمت — بلوک nginx برای qeymat.online
#
# این سرور چند پروژه دارد (آساپی و قیمت)، پس اینجا هیچ تنظیم سراسری
# تعریف نشده تا با سایت‌های دیگر تداخل نکند. نام‌ها همه qeymat_ پیشوند
# دارند که با بلوک‌های پروژه‌های دیگر برخورد نکنند.
#
# پیش‌نیاز: یک‌بار cloudflare-realip.sh را اجرا کنید تا آی‌پی واقعی
# کاربران بازیابی شود (rate limit به آن وابسته است).
# ---------------------------------------------------------------

upstream qeymat_web {
    # پورت باید با WEB_PORT در فایل .env پروژه یکی باشد
    server 127.0.0.1:3100;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=qeymat_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name qeymat.online www.qeymat.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://qeymat.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.qeymat.online;

    ssl_certificate     /etc/ssl/cloudflare/qeymat.online.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qeymat.online.key;

    return 301 https://qeymat.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qeymat.online;

    # گواهی Origin کلادفلر (۱۵ ساله، فقط برای اتصال CF به سرور)
    ssl_certificate     /etc/ssl/cloudflare/qeymat.online.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qeymat.online.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:qeymat_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml font/woff2;

    access_log /var/log/nginx/qeymat.access.log;
    error_log  /var/log/nginx/qeymat.error.log;

    # سرویس‌ورکر هرگز کش نمی‌شود، وگرنه نسخه‌ی قدیمی اپ گیر می‌کند
    location = /sw.js {
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # دارایی‌های هش‌دار Next
    location /_next/static/ {
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /fonts/ {
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API عمومی مشتریان — محدودیت نرخ لبه‌ای
    location /api/v1/ {
        limit_req zone=qeymat_api burst=60 nodelay;
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # بازگشت از درگاه زرین‌پال — هرگز کش نشود
    location /api/payment/ {
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://qeymat_web;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}